[package]
name = "fitdistcp-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Binding-agnostic numerics core for fitdistcp (calibrating prior prediction)."

[lib]
name = "fitdistcp_core"
crate-type = ["rlib"]

[dependencies]
# Numerics dependencies (versions pinned in the workspace manifest).
# `special`/`statrs` provide gamma/digamma/trigamma and distribution CDFs/quantiles
# (§4.3); `nalgebra` backs linear algebra for MLE and the information matrix;
# `argmin` provides the BFGS optimizer (§4.2); `rayon` enables data-parallel
# evaluation over prediction grids and quantile batches (§6).
special = { workspace = true }
statrs = { workspace = true }
nalgebra = { workspace = true }
argmin = { workspace = true }
rayon = { workspace = true }
# W18/A4: `rand`/`rand_distr` drive the `reltest` reliability simulation
# (fixed-seed Monte Carlo). These are **normal** dependencies (not dev-only)
# because `reltest` is a public core routine the bindings expose; the fixed-seed
# entry point keeps the library deterministic for a given seed.
rand = { workspace = true }
rand_distr = { workspace = true }
# Cross-language benchmark (Group B): the shared input fixture
# `benches/perf_inputs.json` is parsed with serde_json. This is a *normal*
# dependency (not dev-only) because the `perf_timing` binary under `src/bin/`
# also reads the fixture, and dev-dependencies are not available to binaries.
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
# W16: Criterion benchmarks for the performance-critical paths (§6). These are
# dev-only and never linked into the library or the binding crates.
criterion = { workspace = true }
# W18: `rand` drives the reltest reliability simulation (fixed-seed Monte Carlo).
# Dev-only: the library itself stays free of RNG state so it remains deterministic.
rand = { workspace = true }
rand_distr = { workspace = true }

# W16 benchmark targets. `harness = false` hands `main` to Criterion so the
# benches are excluded from the normal `cargo test` run (§6, W16 constraint).
[[bench]]
name = "derivatives"
harness = false

[[bench]]
name = "dmgs_expansion"
harness = false

[[bench]]
name = "mle_fitting"
harness = false

# Cross-language performance comparison (Group A). The workload spec lives in
# `benches/PERF_COMPARISON.md` and the shared inputs in `benches/perf_inputs.json`.
# `harness = false` keeps it out of `cargo test`, matching the other bench targets.
[[bench]]
name = "cross_language"
harness = false
