[package]
name = "fitdistcp-py"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "PyO3 Python bindings for fitdistcp."

[lib]
name = "fitdistcp"
crate-type = ["cdylib"]

[dependencies]
fitdistcp-core.workspace = true
pyo3.workspace = true
numpy.workspace = true
# B3.3: the binding inverts the normalized observed information `ldd` to build
# the reference object-dtype `standard_errors` (the reference `utils.py::make_se`
# takes `lddi = inv(ldd)`). `nalgebra` is already a workspace dependency.
nalgebra.workspace = true
