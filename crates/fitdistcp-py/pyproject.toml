[build-system]
requires = ["maturin>=1.5,<2.0"]
build-backend = "maturin"

[project]
name = "fitdistcp"
version = "0.0.4"
description = "Calibrating prior prediction for distributions (Rust port, Python bindings)."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "fitdistcp authors", email = "noreply@example.com" }]
keywords = ["statistics", "distribution", "prediction", "calibrating-prior", "rust"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Mathematics",
]
# Upper bound: NumPy 2.3.0 dropped manylinux2014 (glibc 2.17) wheels, so on the
# manylinux2014 cibuildwheel images pip would fall back to building NumPy from
# source — which fails because the image's GCC 10.2.1 is below NumPy's required
# GCC >= 10.3 ("NumPy requires GCC >= 10.3"). Capping at <2.3 keeps NumPy 2.2.6
# (the last release with a manylinux2014 cp312 wheel) as the resolved version on
# the glibc-2.17 images, while newer NumPy remains available on platforms that
# ship wheels (macOS/Windows/manylinux_2_28).
dependencies = ["numpy>=1.22,<2.3"]

[project.urls]
Repository = "https://github.com/stephenjewson/fitdistcp"

[project.optional-dependencies]
test = ["pytest>=7.0"]

[tool.maturin]
# B1: the extension module is private (`fitdistcp._fitdistcp`); the public API is
# provided by the thin Python submodules under `python/fitdistcp/` (B3).
module-name = "fitdistcp._fitdistcp"
# B5: ship the Python package alongside the compiled extension.
python-source = "python"
manifest-path = "Cargo.toml"
features = ["pyo3/extension-module"]
# Build abi3 wheels so a single wheel per platform works across CPython 3.9+.
# (Requires the crate to be abi3-compatible; see the release workflow.)
# Uncomment once the abi3 feature is wired through Cargo.toml:
#   compatibility = "manylinux2014"
#   features = ["pyo3/extension-module", "pyo3/abi3-py39"]

[tool.pytest.ini_options]
testpaths = ["tests"]

# ---------------------------------------------------------------------------
# cibuildwheel (W21): build manylinux / macOS / Windows wheels.
#
# Driven by the release workflow (.github/workflows/release.yml) and runnable
# locally with:
#   docker compose run --rm dev bash -lc "cd crates/fitdistcp-py && \
#     CIBW_BUILD='cp39-*' cibuildwheel --platform linux"
#
# The cibuildwheel manylinux images do NOT ship a Rust toolchain (verified:
# neither `rustup` nor `cargo` is on PATH in manylinux2014 / manylinux_2_28),
# so `before-all` installs rustup + the pinned toolchain itself. The toolchain
# version matches rust-toolchain.toml (1.85.0) so local, CI, and wheel builds
# all use the same compiler.
#
# IMPORTANT: cibuildwheel does NOT add $HOME/.cargo/bin to PATH on Linux, and
# environment changes made by `before-all` do not persist to later steps. So
# after installing we symlink the toolchain binaries into /usr/local/bin (which
# is already on the default PATH) — otherwise maturin cannot find `cargo`.
# ---------------------------------------------------------------------------
[tool.cibuildwheel]
# Build for CPython 3.9–3.14 on all platforms. 3.14 is included because
# Ubuntu 26.04 LTS ships Python 3.14 as its default system Python.
build = "cp39-* cp310-* cp311-* cp312-* cp313-* cp314-*"
skip = "*-musllinux_*"
# Run the test suite against each built wheel.
test-command = "python -c \"import fitdistcp; print(fitdistcp.__version__ if hasattr(fitdistcp, '__version__') else 'ok')\""
# Cap numpy here too: cibuildwheel installs test-requires into the test venv,
# and an unbounded numpy would pull a version with no manylinux2014 wheel and
# trigger the same source-build failure (see the `dependencies` note above).
test-requires = ["pytest", "numpy<2.3"]
# Build the wheel from the crate directory (the Cargo workspace root is one
# level up; maturin resolves the workspace automatically).
#
# Install Rust via rustup (the manylinux images ship no toolchain) and pin it
# to 1.85.0 to match rust-toolchain.toml. `--profile minimal` keeps the image
# small; `-y` makes the installer non-interactive. The binaries are then
# symlinked into /usr/local/bin so later build steps (which do not inherit
# before-all's environment) can find `cargo`.
#
# IMPORTANT: rust-toolchain.toml declares `components = ["rustfmt", "clippy"]`.
# If those components are absent, rustup tries to install them LAZILY the first
# time `cargo` runs (e.g. when maturin invokes `cargo metadata`). On the
# manylinux images that lazy install collides with a pre-existing `cargo-fmt`
# binary and rolls back:
#   error: failed to install component: 'rustfmt-preview-...',
#          detected conflict: 'bin/cargo-fmt'
# which aborts the wheel build. Installing the components up front (mirroring
# the macOS override below) means rustup has nothing left to install at build
# time, so the conflict never occurs.
before-all = "echo '=== DIAG: rustup show (pre) ===' && (rustup show || true) && echo '=== DIAG: rustup toolchain list (pre) ===' && (rustup toolchain list || true) && echo '=== DIAG: which cargo-fmt (pre) ===' && (which cargo-fmt || true) && curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain 1.85.0 && rustup component add rustfmt clippy --toolchain 1.85.0 && ln -sf $HOME/.cargo/bin/cargo /usr/local/bin/cargo && ln -sf $HOME/.cargo/bin/rustc /usr/local/bin/rustc && ln -sf $HOME/.cargo/bin/rustup /usr/local/bin/rustup && echo '=== DIAG: rustup show (post) ===' && (rustup show || true) && echo '=== DIAG: rustup component list (post) ===' && (rustup component list --toolchain 1.85.0 || true)"

[tool.cibuildwheel.linux]
# Default to manylinux2014 (glibc 2.17) for the broadest compatibility on
# CPython 3.9–3.13.
manylinux-x86_64-image = "manylinux2014"
manylinux-aarch64-image = "manylinux2014"

# CPython 3.14 is not available in the manylinux2014 (glibc 2.17) image, so
# build the 3.14 wheels on manylinux_2_28 (glibc 2.28) instead. This keeps the
# 3.9–3.13 wheels at the older glibc 2.17 baseline while still shipping 3.14.
#
# NOTE: `overrides` is only valid at the TOP level ([tool.cibuildwheel]),
# not nested under a platform section, and each entry uses `select` (not
# `build`). See cibuildwheel's options.py `_validate_platform_option`.
[[tool.cibuildwheel.overrides]]
select = "cp314-*"
manylinux-x86_64-image = "manylinux_2_28"
manylinux-aarch64-image = "manylinux_2_28"

[tool.cibuildwheel.macos]
# Build for both Intel and Apple Silicon.
archs = ["x86_64", "arm64"]
# Pin the macOS deployment target so the wheel tag and the compiled binary agree.
#
# Rust 1.85 defaults the x86_64-apple-darwin target to
# MACOSX_DEPLOYMENT_TARGET=10.12, but cibuildwheel tags cp39 wheels as
# macosx_10_9. delocate then rejects the wheel because the binary's minimum
# target (10.12) exceeds the tag (10.9):
#   delocate.libsana.DelocationError: Library dependencies do not satisfy
#   target MacOS version 10.9: ... has a minimum target of 10.12
# Setting the env var here makes cibuildwheel tag the wheel macosx_10_12,
# matching the binary that rustc actually produces.
environment = { MACOSX_DEPLOYMENT_TARGET = "10.12" }
# The macOS runners are Apple Silicon (arm64), so building the x86_64 wheel is a
# CROSS-compilation. The pinned toolchain (1.85.0, from rust-toolchain.toml) is
# installed with only the host (aarch64-apple-darwin) std, so `cargo` cannot find
# `core` for the x86_64-apple-darwin target:
#   error[E0463]: can't find crate for `core`
#     = note: the `x86_64-apple-darwin` target may not be installed
# Install the pinned toolchain AND add the x86_64 target so both arches build.
# (The generic `before-all` above only installs the host toolchain.)
before-all = "echo '=== DIAG: rustup show ===' && rustup show && echo '=== DIAG: which cargo-clippy ===' && (which cargo-clippy || true) && echo '=== DIAG: rustup component list (1.85.0) ===' && (rustup component list --toolchain 1.85.0 || true) && echo '=== DIAG: rustup toolchain list ===' && rustup toolchain list && curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain 1.85.0 && rustup component add rustfmt clippy --toolchain 1.85.0 && rustup target add x86_64-apple-darwin --toolchain 1.85.0 && echo '=== DIAG: post-install rustup show ===' && rustup show && echo '=== DIAG: post-install component list ===' && (rustup component list --toolchain 1.85.0 || true)"

[tool.cibuildwheel.windows]
archs = ["AMD64"]
# The top-level `before-all` above is a POSIX/Linux command (`curl | sh`,
# `$HOME`, `ln -sf /usr/local/bin/...`). Windows inherits it unless overridden,
# and Windows has no `/usr/local/bin`, so `ln` fails with:
#   ln: failed to create symbolic link '/usr/local/bin/cargo': No such file or directory
# The GitHub Windows runner already ships a Rust toolchain, but we still pin it
# to 1.85.0 (matching rust-toolchain.toml) so local, CI, and wheel builds all use
# the same compiler. `rustup toolchain install` is idempotent: it is a no-op when
# the toolchain is already present. cibuildwheel runs `before-all` via cmd.exe on
# Windows, so this uses cmd-compatible syntax (no `sh`, `ln`, or `$HOME`).
before-all = "rustup toolchain install 1.85.0 --profile minimal --no-self-update && rustup default 1.85.0"
