# fitdistcp — release / packaging workflow (Work Item W21)
#
# Builds the two distributable artifacts:
#   1. the CRAN-style R source tarball (with the Rust crates vendored so it
#      builds in isolation), and
#   2. PyPI wheels for manylinux / macOS / Windows via cibuildwheel.
#
# Design references:
#   plans/fitdistcp-rust-port-design.md §11 (CRAN policy: vendor crates),
#   §10 Phase 1f (CRAN-style R CMD check + cibuildwheel PyPI wheels).
#
# The R job reuses the SAME Docker image as local development and CI (the
# single source of truth for the toolchains). The wheel jobs use cibuildwheel's
# own manylinux/macOS/Windows images, which ship the Rust toolchain.
#
# Trigger: manual dispatch, or pushing a tag like `v0.1.0`.
#
# PUBLISHING:
#   * GitHub release only — the R source tarball, the Python wheels, and the
#     Python sdist are attached to the GitHub release (tag pushes only). There
#     is no PyPI or CRAN publishing step.

name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  IMAGE_TAG: fitdistcp-dev:release

jobs:
  # ---------------------------------------------------------------------------
  # R: vendor the Rust crates, build the source tarball, and run R CMD check.
  # ---------------------------------------------------------------------------
  r-tarball:
    name: R source tarball + R CMD check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build dev image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          tags: ${{ env.IMAGE_TAG }}
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Vendor the core crate + third-party crates into the R package, refresh
      # the roxygen2 docs, then build the tarball. The vendor tree is generated
      # here (not committed); the man/ pages are committed but regenerated to be
      # safe.
      - name: Vendor Rust crates, refresh docs, and build tarball
        run: |
          docker run --rm -v "$PWD":/workspace -w /workspace "$IMAGE_TAG" \
            bash -lc "bash tools/vendor-r-crate.sh && \
                      cd crates/fitdistcp-r && \
                      R -e 'roxygen2::roxygenise(load_code = \"source\")' && \
                      R CMD build ."

      - name: R CMD check (no manual)
        run: |
          docker run --rm -v "$PWD":/workspace -w /workspace "$IMAGE_TAG" \
            bash -lc "mkdir -p /workspace/.rcheck && \
                      cp /workspace/crates/fitdistcp-r/rusty.fitdistcp_*.tar.gz /workspace/.rcheck/ && \
                      cd /workspace/.rcheck && \
                      R CMD check --no-manual rusty.fitdistcp_*.tar.gz"

      - name: Upload R tarball
        uses: actions/upload-artifact@v4
        with:
          name: r-source-tarball
          path: crates/fitdistcp-r/rusty.fitdistcp_*.tar.gz
          if-no-files-found: error

      - name: Upload R check log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r-check-log
          path: .rcheck/rusty.fitdistcp.Rcheck/00check.log
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # Python: build wheels for Linux / macOS / Windows via cibuildwheel.
  # ---------------------------------------------------------------------------
  wheels:
    name: Wheels (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install cibuildwheel
        run: python -m pip install --upgrade cibuildwheel

      # Run cibuildwheel from the REPOSITORY ROOT and pass the package directory
      # as the positional PACKAGE argument. cibuildwheel copies the *working
      # directory* (the "project") into the build container on Linux, and the
      # PACKAGE argument selects which subdirectory to build. If we instead ran
      # cibuildwheel from `crates/fitdistcp-py` (as before), only that directory
      # would be copied, so the Cargo workspace root `Cargo.toml` (one level up)
      # would be absent and the crate's `edition.workspace = true` /
      # `version.workspace = true` inheritance would fail with:
      #   error inheriting `edition` from workspace root manifest's
      #   `workspace.package.edition` ... failed to find a workspace root
      # Building from the repo root keeps the workspace root manifest (and
      # Cargo.lock) in the build context so maturin/cargo can resolve it.
      #
      # NOTE: cibuildwheel 4.x takes the package as a positional argument
      # (`cibuildwheel <PACKAGE>`); there is no `--package-dir` flag.
      - name: Build wheels
        run: python -m cibuildwheel crates/fitdistcp-py --output-dir crates/fitdistcp-py/wheelhouse

      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: crates/fitdistcp-py/wheelhouse/*.whl
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Python sdist (source distribution).
  # ---------------------------------------------------------------------------
  sdist:
    name: Python sdist
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install maturin
        run: python -m pip install --upgrade "maturin>=1.5,<2.0"

      - name: Build sdist
        working-directory: crates/fitdistcp-py
        run: maturin sdist --out dist

      - name: Upload sdist
        uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: crates/fitdistcp-py/dist/*.tar.gz
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Publish: attach the tarball + wheels to a GitHub release (tag pushes only).
  # ---------------------------------------------------------------------------
  publish:
    name: Publish release assets
    needs: [r-tarball, wheels, sdist]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Download ONLY the artifacts we publish. A bare `download-artifact@v4`
      # (no `name`/`pattern`) downloads *every* artifact in the run, which
      # includes the Docker build-cache blob created by the `cache-to: type=gha`
      # in the `r-tarball` job (named like
      # `vdog~rusty-fitdistcp~EXH051.dockerbuild`). That cache blob is not a
      # normal artifact zip, so extraction fails after 5 retries with
      # "Unable to download and extract artifact" and fails the whole job.
      # Filtering by `pattern` restricts the download to the real release
      # assets (R tarball, wheels, sdist).
      #
      # IMPORTANT: `pattern` is a SINGLE glob, NOT a newline-separated list.
      # A YAML block scalar (`pattern: |` with one name per line) is passed
      # verbatim as the literal string "r-source-tarball\nwheels-*\nsdist\n",
      # which matches no artifact names — so nothing is downloaded, `dist/`
      # stays empty, and every `files:` glob in action-gh-release then reports
      # "does not match any files" (the symptom that broke the v0.0.2 release).
      # Use ONE brace-expansion glob (supported by @actions/glob) to match all
      # three artifact families in a single pattern.
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: "{r-source-tarball,wheels-*,sdist}"
          merge-multiple: false

      # DIAG: prove what the download step actually produced. If `dist/` is
      # empty (or the expected subdirectories are missing), the `pattern` above
      # did not match — which is exactly the failure mode this step guards
      # against. `find` prints the full tree so the next run's log shows the
      # real layout instead of only the downstream "does not match any files".
      - name: "DIAG: list downloaded artifacts"
        run: |
          echo "=== DIAG: dist/ tree ==="
          find dist -type f -print 2>/dev/null || echo "(dist/ does not exist)"
          echo "=== DIAG: expected release assets ==="
          ls -la dist/r-source-tarball/*.tar.gz 2>/dev/null || echo "MISSING: dist/r-source-tarball/*.tar.gz"
          ls -la dist/wheels-*/*.whl 2>/dev/null || echo "MISSING: dist/wheels-*/*.whl"
          ls -la dist/sdist/*.tar.gz 2>/dev/null || echo "MISSING: dist/sdist/*.tar.gz"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/r-source-tarball/*.tar.gz
            dist/wheels-*/*.whl
            dist/sdist/*.tar.gz
          generate_release_notes: true
